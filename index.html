<script>
    // === CONFIGURAZIONE FIREBASE ===
    const firebaseConfig = {
        apiKey: "AIzaSyDummyKeyForGalleonApp2026",
        authDomain: "galleon-spesa-live.firebaseapp.com",
        databaseURL: "https://galleon-spesa-live-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "galleon-spesa-live"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const dbRef = db.ref('galleon_spesa_live_v6');

    let catalog = {
        ortofrutta: {
            title: "🍏 Ortofrutta e Freschi",
            headerBg: "bg-emerald-700 text-white",
            cardBg: "bg-emerald-50/80 border-emerald-300",
            textCol: "text-emerald-950",
            items: ["LATTUAGA", "MELANZANE", "ZUCCHERE", "POMODORI", "FUNGHI", "PEPERONI", "CIPOLLE", "POM.PERINI", "RUCOLA", "RICCIA", "RADICCHIO", "PATATE", "PREZZEMOLO", "CAROTE", "AGLIO", "CETRIOLI", "LIMONI", "ANANAS", "MELE", "PERE", "PISTACCHI", "KIWI", "PANE"]
        },
        macelleria: {
            title: "🥩 Macelleria e Pescheria",
            headerBg: "bg-rose-700 text-white",
            cardBg: "bg-rose-50/80 border-rose-300",
            textCol: "text-rose-950",
            items: ["C.HAMBURGER", "CHIANINA", "TONNO", "SALMONE", "TRANCI SALMONE", "SPIEDINI"]
        },
        latticini: {
            title: "🧀 Latticini, Salumi e Uova",
            headerBg: "bg-sky-700 text-white",
            cardBg: "bg-sky-50/80 border-sky-300",
            textCol: "text-sky-950",
            items: ["MOZZARELLE", "MOZZ.SENZA LATTOSIO", "BOCCONCINI", "STRACCHINO", "EMMENTHAL", "SOTTILETTE", "CEDDAR", "YOGURT", "PHILADELPHIA", "BURRO", "LATTE", "PANNA SPRAY", "PANNA FRESCA", "UOVA"]
        },
        dispensa: {
            title: "🥫 Dispensa e Scatolame",
            headerBg: "bg-amber-700 text-white",
            cardBg: "bg-amber-50/80 border-amber-300",
            textCol: "text-amber-950",
            items: ["SALE", "PEPE", "PISELLI", "NOCI", "LIMMY", "CONTEN.PANNA COTTA", "PESTO", "MAIS", "CARCIOFI", "CAPPERI", "CRAUTI", "CECI", "ACETO", "OLIO PICCANTE", "ZUCCHERO", "ZUCCHERO A VELO", "CIOCCOLATO FOND", "CROCCANTE", "BISCOTTI SECCHI", "SAVOIARDI", "VANILLINA", "MARMELLATA", "FRUTTI BOSCO", "CAFFE'", "LIEVITO PANINI", "PIZZAIOLO", "FARINA PER TORTE", "TABASCO", "ROTOLONI", "TOV.COLORATI", "STECCHINI", "BICCHIERI", "SPUGNE VASSOI", "PELLICOLA", "ORDINARE DOLCE", "RITIRARE DOLCE"]
        },
        bevande: {
            title: "🍷 Bevande e Alcolici",
            headerBg: "bg-indigo-700 text-white",
            cardBg: "bg-indigo-50/80 border-indigo-300",
            textCol: "text-indigo-950",
            items: ["COCA COLA", "APEROL"]
        },
        pulizia: {
            title: "🧹 Pulizia e Detergenti",
            headerBg: "bg-purple-700 text-white",
            cardBg: "bg-purple-50/80 border-purple-300",
            textCol: "text-purple-950",
            items: ["DETERSIVO PIATTI", "SPUGNE PIATTI", "CANDEGGINA", "SAPONE MANI", "MICROFIBRA"]
        }
    };

    const authors = ["Orsola", "Nazir", "Maimona", "Maria", "Alessia"];
    
    let currentSession = JSON.parse(localStorage.getItem('galleon_session_v6')) || { 
        date: new Date().toISOString().split('T')[0], 
        author: "Orsola", 
        items: [] 
    };
    
    let isApplyingRemoteData = false;
    let lastServerTimestamp = 0;

    // === INIZIALIZZAZIONE ALL'AVVIO ===
    window.onload = function() {
        document.getElementById('inputDate').value = currentSession.date;
        if (currentSession.author) {
            document.getElementById('inputAuthor').value = currentSession.author;
            document.getElementById('displayAuthor').innerText = currentSession.author;
        }
        document.getElementById('displayDate').innerText = currentSession.date;
        
        renderAuthorButtons();
        initCatalogCategories();

        // Ascoltatore in tempo reale da Firebase
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.session) {
                if (data.timestamp && data.timestamp >= lastServerTimestamp) {
                    // Evita di sovrascrivere se l'utente sta digitando in un input
                    if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                        return; 
                    }

                    isApplyingRemoteData = true;
                    currentSession = data.session;
                    if (data.catalog) {
                        catalog = data.catalog;
                    }
                    lastServerTimestamp = data.timestamp;
                    
                    localStorage.setItem('galleon_session_v6', JSON.stringify(currentSession));
                    applySessionToDOM();
                    isApplyingRemoteData = false;
                }
            }
        }, (error) => {
            console.warn("Modalità offline attiva o restrizioni Cloud rilevate:", error);
        });
    };

    function syncStateToCloud() {
        if (isApplyingRemoteData) return;
        
        localStorage.setItem('galleon_session_v6', JSON.stringify(currentSession));
        
        const newTimestamp = Date.now();
        lastServerTimestamp = newTimestamp;

        dbRef.set({
            session: currentSession,
            catalog: catalog,
            timestamp: newTimestamp
        }).catch((e) => {
            console.error("Errore sync cloud:", e);
        });
    }

    function applySessionToDOM() {
        if (currentSession.date) document.getElementById('inputDate').value = currentSession.date;
        if (currentSession.author) {
            document.getElementById('inputAuthor').value = currentSession.author;
            document.getElementById('displayDate').innerText = currentSession.date;
            document.getElementById('displayAuthor').innerText = currentSession.author;
        }

        document.querySelectorAll('input[type="checkbox"]').forEach(chk => chk.checked = false);
        document.querySelectorAll('input[type="text"]').forEach(txt => {
            if (!txt.id.includes('inputAuthor') && !txt.id.includes('inputDate')) txt.value = '';
        });

        if (currentSession.items) {
            currentSession.items.forEach(i => {
                Object.keys(catalog).forEach(catKey => {
                    catalog[catKey].items.forEach((item, itemIdx) => {
                        if (item === i.name) {
                            const globalId = `${catKey}-${itemIdx}`;
                            const chk = document.getElementById(`cat-check-${globalId}`);
                            const qty = document.getElementById(`cat-qty-${globalId}`);
                            const note = document.getElementById(`cat-note-${globalId}`);
                            if (chk && qty) {
                                chk.checked = true;
                                qty.value = i.qty || '';
                                if (note) note.value = i.note || "";
                            }
                        }
                    });
                });
            });
        }

        if (!document.getElementById('shopSection').classList.contains('hidden')) {
            renderActiveShoppingList();
        }
    }

    function toggleSidebar() {
        const menu = document.getElementById('sideMenu');
        const overlay = document.getElementById('menuOverlay');
        if (menu.classList.contains('-translate-x-full')) {
            menu.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
        } else {
            menu.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        }
    }

    function renderAuthorButtons() {
        const container = document.getElementById('authorButtons');
        if (!container) return;
        container.innerHTML = '';
        authors.forEach(auth => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = "p-2.5 rounded-xl text-xs font-extrabold border-2 border-slate-200 bg-white hover:border-orange-500 hover:text-orange-600 transition text-slate-700 shadow-xs";
            btn.innerText = auth;
            btn.onclick = () => {
                document.getElementById('inputAuthor').value = auth;
                currentSession.author = auth;
                document.getElementById('displayAuthor').innerText = auth;
                syncStateToCloud();
            };
            container.appendChild(btn);
        });
    }

    function initCatalogCategories() {
        const container = document.getElementById('catalogCategoriesContainer');
        if (!container) return;
        container.innerHTML = '';

        Object.keys(catalog).forEach(catKey => {
            const cat = catalog[catKey];
            let cardDiv = document.createElement('div');
            cardDiv.className = `rounded-2xl border-2 ${cat.cardBg} p-4 shadow-sm flex flex-col`;
            
            let htmlHeader = `
                <div class="px-3 py-2 rounded-xl ${cat.headerBg} font-extrabold text-xs uppercase tracking-wider mb-3 shadow-xs flex justify-between items-center">
                    <span>${cat.title}</span>
                    <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-md">${cat.items.length} prodotti</span>
                </div>
                <div class="space-y-2.5 flex-grow overflow-y-auto max-h-72 pr-1">
            `;

            let itemsHtml = '';
            cat.items.forEach((item, itemIdx) => {
                const globalId = `${catKey}-${itemIdx}`;
                itemsHtml += `
                    <div class="bg-white/90 p-2.5 rounded-xl border border-slate-200/80 shadow-xs flex flex-col gap-2">
                        <div class="flex items-center justify-between gap-2">
                            <label class="flex items-center gap-2 cursor-pointer flex-grow min-w-0">
                                <input type="checkbox" id="cat-check-${globalId}" onchange="updateItemSelection('${catKey}', ${itemIdx})" class="w-4 h-4 rounded text-orange-600 focus:ring-orange-500 shrink-0">
                                <span class="text-xs font-extrabold text-slate-800 uppercase tracking-tight truncate">${item}</span>
                            </label>
                            <input type="text" id="cat-qty-${globalId}" placeholder="Qtà" oninput="updateItemSelection('${catKey}', ${itemIdx})" class="w-14 p-1.5 border border-slate-200 rounded-lg text-xs text-center font-bold text-slate-900 bg-slate-50 focus:outline-none focus:border-orange-500 shrink-0">
                        </div>
                        <input type="text" id="cat-note-${globalId}" placeholder="Nota (es. cassa, bancale...)" oninput="updateItemSelection('${catKey}', ${itemIdx})" class="w-full p-1.5 border border-slate-200 rounded-lg text-[11px] font-semibold text-slate-800 bg-slate-50 focus:outline-none focus:border-orange-500">
                    </div>
                `;
            });

            cardDiv.innerHTML = htmlHeader + itemsHtml + `</div>`;
            container.appendChild(cardDiv);
        });
    }

    function updateItemSelection(catKey, itemIdx) {
        const globalId = `${catKey}-${itemIdx}`;
        const chk = document.getElementById(`cat-check-${globalId}`);
        const qty = document.getElementById(`cat-qty-${globalId}`);
        const note = document.getElementById(`cat-note-${globalId}`);
        const itemName = catalog[catKey].items[itemIdx];

        let existingIndex = currentSession.items.findIndex(i => i.name === itemName);

        if (chk.checked) {
            const itemObj = {
                name: itemName,
                qty: qty.value.trim() || "1",
                note: note ? note.value.trim() : "",
                taken: existingIndex >= 0 ? currentSession.items[existingIndex].taken : false
            };
            if (existingIndex >= 0) {
                currentSession.items[existingIndex] = itemObj;
            } else {
                currentSession.items.push(itemObj);
            }
        } else {
            if (existingIndex >= 0) {
                currentSession.items.splice(existingIndex, 1);
            }
        }
        syncStateToCloud();
    }

    function startMode(mode) {
        const dateVal = document.getElementById('inputDate').value;
        const authorVal = document.getElementById('inputAuthor').value.trim() || "Orsola";
        
        currentSession.date = dateVal;
        currentSession.author = authorVal;
        document.getElementById('displayDate').innerText = dateVal;
        document.getElementById('displayAuthor').innerText = authorVal;

        syncStateToCloud();
        
        document.getElementById('setupSection').classList.add('hidden');
        document.getElementById('createSection').classList.remove('hidden');
        applySessionToDOM();
    }

    function goToSupermarketDirect() {
        startMode('shop');
        document.getElementById('createSection').classList.add('hidden');
        document.getElementById('shopSection').classList.remove('hidden');
        renderActiveShoppingList();
    }

    function goHome() {
        document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
        document.getElementById('setupSection').classList.remove('hidden');
    }

    function resetSession() {
        if (confirm("Vuoi cambiare utente o data della sessione?")) {
            goHome();
        }
    }

    function goToReviewScreen() {
        if (currentSession.items.length === 0) {
            alert("Seleziona almeno un prodotto prima di procedere!");
            return;
        }
        document.getElementById('createSection').classList.add('hidden');
        document.getElementById('reviewSection').classList.remove('hidden');
        
        const listContainer = document.getElementById('reviewItemsList');
        listContainer.innerHTML = '';
        currentSession.items.forEach(i => {
            let div = document.createElement('div');
            div.className = "flex justify-between items-center bg-white p-3 rounded-xl border border-amber-200 shadow-xs text-xs font-bold text-slate-800";
            div.innerHTML = `<span>🛒 ${i.name} <span class="text-orange-600 font-extrabold">(Qtà: ${i.qty})</span> ${i.note ? '• <span class="text-slate-500">' + i.note + '</span>' : ''}</span>`;
            listContainer.appendChild(div);
        });
    }

    function backToCreateFromReview() {
        document.getElementById('reviewSection').classList.add('hidden');
        document.getElementById('createSection').classList.remove('hidden');
    }

    function confirmAndSaveShoppingList() {
        syncStateToCloud();
        document.getElementById('reviewSection').classList.add('hidden');
        document.getElementById('postSaveSection').classList.remove('hidden');
        
        const summaryList = document.getElementById('savedItemsSummaryList');
        summaryList.innerHTML = '';
        currentSession.items.forEach(i => {
            let div = document.createElement('div');
            div.className = "bg-white p-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-800 flex justify-between";
            div.innerHTML = `<span>${i.name} (Qtà: ${i.qty})</span> <span class="text-slate-500">${i.note || ''}</span>`;
            summaryList.appendChild(div);
        });
    }

    function addExtraItemAfterSave() {
        const name = document.getElementById('extraPostName').value.trim().toUpperCase();
        const qty = document.getElementById('extraPostQty').value.trim() || "1";
        const note = document.getElementById('extraPostNote').value.trim();

        if (!name) {
            alert("Inserisci il nome del prodotto!");
            return;
        }

        currentSession.items.push({ name, qty, note, taken: false });
        syncStateToCloud();

        document.getElementById('extraPostName').value = '';
        document.getElementById('extraPostQty').value = '';
        document.getElementById('extraPostNote').value = '';

        confirmAndSaveShoppingList();
    }

    function goToSupermarketFromPostSave() {
        document.getElementById('postSaveSection').classList.add('hidden');
        document.getElementById('shopSection').classList.remove('hidden');
        renderActiveShoppingList();
    }

    function completeShoppingCycle() {
        goHome();
    }

    function renderActiveShoppingList() {
        const container = document.getElementById('activeShoppingList');
        if (!container) return;
        container.innerHTML = '';

        if (currentSession.items.length === 0) {
            container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400 font-bold text-sm">Nessun prodotto in lista. Torna a compilare la spesa!</div>`;
            updateProgress(0, 0);
            return;
        }

        let takenCount = 0;
        currentSession.items.forEach((item, idx) => {
            if (item.taken) takenCount++;

            let div = document.createElement('div');
            div.className = `p-3.5 rounded-2xl border-2 flex items-center justify-between transition shadow-xs ${item.taken ? 'bg-emerald-50/90 border-emerald-300 text-emerald-950 opacity-75 line-through' : 'bg-white border-slate-200 text-slate-900'}`;
            
            div.innerHTML = `
                <label class="flex items-center gap-3 cursor-pointer flex-grow min-w-0">
                    <input type="checkbox" ${item.taken ? 'checked' : ''} onchange="toggleItemTaken(${idx})" class="w-5 h-5 rounded text-blue-600 focus:ring-blue-500 shrink-0">
                    <div class="min-w-0">
                        <span class="text-sm font-extrabold uppercase tracking-tight block truncate">${item.name}</span>
                        <span class="text-xs font-bold text-orange-600 block">Qtà: ${item.qty} ${item.note ? '• ' + item.note : ''}</span>
                    </div>
                </label>
            `;
            container.appendChild(div);
        });

        updateProgress(takenCount, currentSession.items.length);
    }

    function toggleItemTaken(idx) {
        currentSession.items[idx].taken = !currentSession.items[idx].taken;
        syncStateToCloud();
        renderActiveShoppingList();
    }

    function updateProgress(taken, total) {
        const text = document.getElementById('progressText');
        const bar = document.getElementById('progressBar');
        if (text) text.innerText = `Prodotti presi: ${taken} / ${total}`;
        const percent = total > 0 ? (taken / total) * 100 : 0;
        if (bar) bar.style.width = `${percent}%`;
    }

    function promptCompleteShopping() {
        document.getElementById('shopSection').classList.add('hidden');
        document.getElementById('summaryModalSection').classList.remove('hidden');

        const takenContainer = document.getElementById('summaryTakenList');
        const missingContainer = document.getElementById('summaryMissingList');
        takenContainer.innerHTML = '';
        missingContainer.innerHTML = '';

        let hasTaken = false;
        let hasMissing = false;

        currentSession.items.forEach(i => {
            let div = document.createElement('div');
            div.className = "bg-white p-2.5 rounded-xl border text-xs font-bold text-slate-800 shadow-xs flex justify-between";
            div.innerHTML = `<span>${i.name} (Qtà: ${i.qty})</span> <span class="text-slate-500">${i.note || ''}</span>`;
            
            if (i.taken) {
                hasTaken = true;
                takenContainer.appendChild(div);
            } else {
                hasMissing = true;
                missingContainer.appendChild(div);
            }
        });

        if (!hasTaken) takenContainer.innerHTML = `<span class="text-xs text-slate-400 italic">Nessun prodotto preso.</span>`;
        if (!hasMissing) missingContainer.innerHTML = `<span class="text-xs text-slate-400 italic">Nessun prodotto mancante.</span>`;
    }

    function backToShopFromSummary() {
        document.getElementById('summaryModalSection').classList.add('hidden');
        document.getElementById('shopSection').classList.remove('hidden');
        renderActiveShoppingList();
    }

    function confirmAndFinalizeShopping() {
        let history = JSON.parse(localStorage.getItem('galleon_history_v6')) || [];
        history.unshift({
            date: currentSession.date,
            author: currentSession.author,
            items: [...currentSession.items],
            timestamp: Date.now()
        });
        localStorage.setItem('galleon_history_v6', JSON.stringify(history));

        currentSession.items = currentSession.items.filter(i => !i.taken);
        syncStateToCloud();

        document.getElementById('summaryModalSection').classList.add('hidden');
        goHome();
        alert("Spesa archiviata con successo nello Storico!");
    }

    function clearEntireShopping() {
        if (confirm("Vuoi svuotare interamente la spesa corrente?")) {
            currentSession.items = [];
            syncStateToCloud();
            renderActiveShoppingList();
        }
    }

    function openAddProductModal() {
        document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
        document.getElementById('addProductSection').classList.remove('hidden');
    }

    function saveNewCatalogProduct() {
        const name = document.getElementById('newProdNameInput').value.trim().toUpperCase();
        const category = document.getElementById('newProdCategorySelect').value;

        if (!name) {
            alert("Inserisci il nome del prodotto!");
            return;
        }

        if (!catalog[category].items.includes(name)) {
            catalog[category].items.push(name);
            syncStateToCloud();
            alert(`Prodotto "${name}" aggiunto con successo al reparto ${catalog[category].title}!`);
            document.getElementById('newProdNameInput').value = '';
            goHome();
        } else {
            alert("Il prodotto è già presente in questo reparto!");
        }
    }

    function openManageProductsScreen() {
        document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
        document.getElementById('manageProductsSection').classList.remove('hidden');
        
        const container = document.getElementById('manageCatalogContainer');
        container.innerHTML = '';

        Object.keys(catalog).forEach(catKey => {
            const cat = catalog[catKey];
            let div = document.createElement('div');
            div.className = `rounded-2xl border-2 ${cat.cardBg} p-4 shadow-sm flex flex-col`;
            
            let html = `
                <div class="px-3 py-2 rounded-xl ${cat.headerBg} font-extrabold text-xs uppercase tracking-wider mb-3 shadow-xs">
                    ${cat.title}
                </div>
                <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
            `;

            cat.items.forEach((item, idx) => {
                html += `
                    <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-xs flex justify-between items-center text-xs font-bold text-slate-800">
                        <span class="truncate uppercase">${item}</span>
                        <button onclick="deleteCatalogItem('${catKey}', ${idx})" class="text-rose-500 hover:text-rose-700 font-extrabold px-2 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 transition shrink-0">🗑️</button>
                    </div>
                `;
            });

            div.innerHTML = html + `</div>`;
            container.appendChild(div);
        });
    }

    function deleteCatalogItem(catKey, idx) {
        if (confirm("Vuoi rimuovere questo prodotto dal catalogo?")) {
            catalog[catKey].items.splice(idx, 1);
            syncStateToCloud();
            openManageProductsScreen();
        }
    }

    function showHistory() {
        document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
        document.getElementById('historySection').classList.remove('hidden');

        const container = document.getElementById('historyContainer');
        const statsDashboard = document.getElementById('statsDashboard');
        container.innerHTML = '';
        statsDashboard.innerHTML = '';

        let history = JSON.parse(localStorage.getItem('galleon_history_v6')) || [];

        let totalOrders = history.length;
        let totalItemsBought = history.reduce((acc, h) => acc + h.items.filter(i => i.taken).length, 0);

        statsDashboard.innerHTML = `
            <div class="bg-slate-900 text-white p-4 rounded-2xl border border-slate-800 shadow-sm">
                <span class="text-[10px] uppercase tracking-wider text-slate-400 block font-bold">Ordini Totali</span>
                <span class="text-2xl font-extrabold text-orange-400">${totalOrders}</span>
            </div>
            <div class="bg-slate-900 text-white p-4 rounded-2xl border border-slate-800 shadow-sm">
                <span class="text-[10px] uppercase tracking-wider text-slate-400 block font-bold">Prodotti Acquistati</span>
                <span class="text-2xl font-extrabold text-emerald-400">${totalItemsBought}</span>
            </div>
        `;

        if (history.length === 0) {
            container.innerHTML = `<div class="text-center py-8 text-slate-400 font-bold text-sm">Nessun ordine nello storico.</div>`;
            return;
        }

        history.forEach((h, hIdx) => {
            let div = document.createElement('div');
            div.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm text-slate-900";
            
            let itemsHtml = h.items.map(i => `<li class="text-xs font-bold ${i.taken ? 'text-emerald-700' : 'text-slate-400'}">${i.name} (Qtà: ${i.qty}) ${i.note ? '- ' + i.note : ''}</li>`).join('');

            div.innerHTML = `
                <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100">
                    <span class="font-extrabold text-sm">📅 ${h.date} • <span class="text-amber-600">👤 ${h.author}</span></span>
                    <button onclick="deleteHistoryItem(${hIdx})" class="text-rose-500 hover:text-rose-700 text-xs font-bold bg-rose-50 px-2.5 py-1 rounded-xl">Elimina Storico</button>
                </div>
                <ul class="list-disc pl-5 space-y-1">${itemsHtml}</ul>
            `;
            container.appendChild(div);
        });
    }

    function deleteHistoryItem(idx) {
        if (confirm("Vuoi eliminare questo storico?")) {
            let history = JSON.parse(localStorage.getItem('galleon_history_v6')) || [];
            history.splice(idx, 1);
            localStorage.setItem('galleon_history_v6', JSON.stringify(history));
            showHistory();
        }
    }

    function exportHistoryExcel() {
        let history = JSON.parse(localStorage.getItem('galleon_history_v6')) || [];
        if (history.length === 0) {
            alert("Nessun dato nello storico da esportare!");
            return;
        }
        let csvContent = "data:text/csv;charset=utf-8,Data,Autore,Prodotto,Quantita,Nota,Preso\n";
        history.forEach(h => {
            h.items.forEach(i => {
                csvContent += `${h.date},${h.author},"${i.name}",${i.qty},"${i.note || ''}",${i.taken ? 'SI' : 'NO'}\n`;
            });
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "storico_spesa_galleon.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportHistoryJSON() {
        let history = JSON.parse(localStorage.getItem('galleon_history_v6')) || [];
        if (history.length === 0) {
            alert("Nessun dato nello storico da esportare!");
            return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(history, null, 2));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", "storico_spesa_galleon.json");
        document.body.appendChild(dlAnchorElem);
        dlAnchorElem.click();
        dlAnchorElem.remove();
    }
</script>
